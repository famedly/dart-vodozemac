name: vodozemac
description: Provides bindings to the vodozemac library that has Olm and Megolm implementation from Dart.
version: 0.8.2
homepage: https://famedly.com
repository: https://github.com/famedly/dart-vodozemac
issue_tracker: https://github.com/famedly/dart-vodozemac/issues

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  collection: ^1.19.0
  flutter_rust_bridge: 2.13.0
  web: ^1.1.1

dev_dependencies:
  dart_code_linter: any
  lints: ^6.1.0
  test: ^1.21.0
  test_core: ^0.6.8
  checks: ^0.3.0
  import_sorter: ^4.6.0
  ffigen: ^21.0.0
  olm: ^3.1.0

import_sorter:
  comments: false
  ignored_files: # ignore generated files
    - \/lib\/src\/generated\/*