name: Publish to pub.dev

on:
  push:
    tags:
    - v[0-9]+.[0-9]+.[0-9]+
  # Builds the release assets for an existing tag and attaches them to its
  # release, without publishing (e.g. to backfill a release from before assets).
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v0.9.1
        required: true

defaults:
  run:
    shell: bash
    working-directory: ./dart

jobs:
  build_assets:
    uses: ./.github/workflows/build_assets.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  # Runs before publishing: the published flutter_vodozemac points SwiftPM at
  # this release's XCFrameworks.
  release:
    needs: [build_assets]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: assets
      - name: Create release or attach assets
        run: |
          (cd ../assets && sha256sum * > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ../assets/* --clobber
          else
            notes=$(../scripts/extract_changelog.sh "${TAG#v}")
            if [ -n "$notes" ]; then
              gh release create "$TAG" ../assets/* --verify-tag -t "$TAG" --notes "$notes"
            else
              gh release create "$TAG" ../assets/* --verify-tag -t "$TAG" --generate-notes
            fi
          fi

  # Inlined from famedly/frontend-ci-templates publish-pub.yml: the template runs at the repo root, but the package is in dart/.
  publish:
    needs: [release]
    if: github.event_name == 'push'
    environment: "pub.dev"
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read env file
        run: cat ../.github/workflows/versions.env >> $GITHUB_ENV
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      - name: Install dependencies
        run: dart pub get --no-example
      # No --dry-run step: it exits 65 on the expected warning about the exact flutter_rust_bridge pin.
      # -f still refuses to publish on validation errors.
      - name: Publish to pub.dev
        run: dart pub publish -f

  publish_flutter:
    needs: [publish]
    environment: "pub.dev"
    permissions:
      contents: read
      id-token: write # Required for authentication using OIDC
    # macOS for `swift package`, which checks the rewritten manifests.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./flutter
    steps:
      - uses: actions/checkout@v4
      - name: Read env file
        run: cat ../.github/workflows/versions.env >> $GITHUB_ENV
      - name: Point SwiftPM at the release's XCFrameworks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for platform in ios macos; do
            asset="flutter_vodozemac-$platform.xcframework.zip"
            gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$RUNNER_TEMP"
            checksum=$(swift package compute-checksum "$RUNNER_TEMP/$asset")
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset"
            manifest="$platform/flutter_vodozemac/Package.swift"
            sed -i '' "s|path: \"flutter_vodozemac.xcframework\"|url: \"$url\", checksum: \"$checksum\"|" "$manifest"
            grep -q "checksum: \"$checksum\"" "$manifest"
            # Downloads the asset from the public URL and verifies the checksum.
            (cd "$platform/flutter_vodozemac" && swift package resolve && find .build/artifacts -name '*.xcframework' | grep -q . && rm -rf .build Package.resolved)
          done
          git diff
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.flutter_version }}
      - name: Install dependencies
        run: flutter pub get
      # Only for the pub.dev OIDC token (flutter's pub reads the same token config); set up last so the token is fresh.
      - uses: dart-lang/setup-dart@a57a6c04cf7d4840e88432aad6281d1e125f0d46
        with:
          sdk: ${{ env.dart_version }}
      # -f publishes despite warnings (no flutter_rust_bridge constraint, the
      # Package.swift files modified above) but still refuses on errors.
      - name: Publish to pub.dev
        run: flutter pub publish -f
